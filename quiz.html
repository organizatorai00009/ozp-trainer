<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер ОЗП — Тестирование</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <h2>Вопрос <span id="current-question-num">0</span> из <span id="total-questions">0</span></h2>
    </div>
    
    <!-- Текст вопроса -->
    <div class="question-box">
      <h3 id="question">Загрузка вопроса...</h3>
    </div>
    
    <!-- Контейнер для вариантов ответов (кнопок) -->
    <div id="options-container" class="options-grid"></div>
    
    <!-- Кнопка перехода к следующему вопросу -->
    <button id="next-btn" class="btn" style="display: none;">Следующий вопрос</button>
  </div>

  <!-- Подключаем файлы скриптов строго в этом порядке -->
  <script src="js/questions.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
